server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Backend (bingo-server) reverse proxy ----
    # The frontend talks to the backend same-origin, so every API/realtime path
    # is proxied to the internal `backend` service. `app.ts` registers /health,
    # /auth, /api and Socket.IO, and these four prefixes cover all of it.
    # `backend` resolves over the Docker network; `depends_on: service_healthy`
    # guarantees it is up before nginx starts.

    # Socket.IO — needs the WebSocket upgrade handshake.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived connections: don't cut the socket on idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Game history and rankings. Under `/api/` rather than at the root like
    # /auth, because the app has its own /history and /leaderboard pages: a
    # root-level /leaderboard here would answer a refresh of that page with
    # JSON instead of the app.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST auth routes.
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend liveness (useful for probing the whole chain through nginx).
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LiveKit signalling (WebSocket). Same-origin subpath, so voice needs no
    # second TLS certificate, no second DNS name and no CORS surface — and the
    # client learns this address from the token ack rather than a build-time
    # variable.
    #
    # Media does NOT come through here: WebRTC connects straight to the
    # published 7881/tcp and 7882/udp on the host.
    location /livekit/ {
        # Resolve `livekit` at request time via Docker's embedded DNS rather
        # than at startup. With a literal hostname nginx refuses to start when
        # the container is absent — which is the normal state for a deployment
        # with voice switched off. This way the site serves fine and /livekit/
        # simply 502s, which the clients already treat as "voice unavailable".
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $livekit_upstream "http://livekit:7880";
        # A variable proxy_pass carries no URI, so strip the prefix by hand;
        # this is the equivalent of the trailing slash on a literal proxy_pass.
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass $livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A call lasts as long as the game does.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Signalling is latency-sensitive; buffering adds nothing but delay.
        proxy_buffering off;
    }

    # ---- Static SPA ----
    # React Router support: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent unnecessary caching of index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache static Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache the game's sound effects.
    #
    # Without this they had no caching headers at all, so every visit
    # re-validated all 28 clips before the loading screen could open — the one
    # thing that screen exists to avoid. They are fetched up front by
    # `AppLoadingGate`, which makes them the largest thing on the critical
    # path after the bundle.
    #
    # Thirty days rather than the `immutable` year the Vite assets get: those
    # carry a content hash in the filename and these do not, so a replaced clip
    # has to be able to reach people who already have the old one. Renaming a
    # clip is the way to force it sooner.
    location /audio/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
