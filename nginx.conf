server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Backend (bingo-server) reverse proxy ----
    # The frontend talks to the backend same-origin, so every API/realtime path
    # is proxied to the internal `backend` service. `app.ts` registers only
    # /health, /auth and Socket.IO, so these three prefixes cover all of it.
    # `backend` resolves over the Docker network; `depends_on: service_healthy`
    # guarantees it is up before nginx starts.

    # Socket.IO — needs the WebSocket upgrade handshake.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived connections: don't cut the socket on idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST auth routes.
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend liveness (useful for probing the whole chain through nginx).
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static SPA ----
    # React Router support: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent unnecessary caching of index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache static Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
