<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Zendalona Bingo">
  <title>Zendalona Bingo</title>
  <!--
    A bingo card whose daubed cells spell a Z: the full top row, the full
    bottom row, and the anti-diagonal joining them.
    The Z is a SHAPE, not a colour difference, so the mark survives greyscale,
    colour-blind vision and a 16px favicon. The tile carries its own indigo
    ground, so it reads on light and dark pages alike.
    Geometry is shared with scripts/generate-app-icons.swift in the mobile repo.
  -->
  <rect width="1024" height="1024" rx="224" fill="#4338CA"/>
  <g fill="#C7D2FE" fill-opacity=".5">
    <circle cx="217" cy="365" r="28"/> <circle cx="365" cy="365" r="28"/> <circle cx="512" cy="365" r="28"/> <circle cx="807" cy="365" r="28"/> <circle cx="217" cy="512" r="28"/>
    <circle cx="365" cy="512" r="28"/> <circle cx="659" cy="512" r="28"/> <circle cx="807" cy="512" r="28"/> <circle cx="217" cy="659" r="28"/> <circle cx="512" cy="659" r="28"/>
    <circle cx="659" cy="659" r="28"/> <circle cx="807" cy="659" r="28"/>
  </g>
  <g fill="#fff">
    <circle cx="217" cy="217" r="59"/> <circle cx="365" cy="217" r="59"/> <circle cx="512" cy="217" r="59"/> <circle cx="659" cy="217" r="59"/> <circle cx="807" cy="217" r="59"/>
    <circle cx="659" cy="365" r="59"/> <circle cx="512" cy="512" r="59"/> <circle cx="365" cy="659" r="59"/> <circle cx="217" cy="807" r="59"/> <circle cx="365" cy="807" r="59"/>
    <circle cx="512" cy="807" r="59"/> <circle cx="659" cy="807" r="59"/> <circle cx="807" cy="807" r="59"/>
  </g>
</svg>
